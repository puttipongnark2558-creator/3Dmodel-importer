name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Mod with Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Universal Mod
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine platforms into one .geode file
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3Dmodel-importer-Universal
          path: ${{ steps.build.outputs.build-output }}