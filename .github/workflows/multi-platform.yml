name: Build Multi-Platform Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: ''
          - name: macOS
            os: macos-latest
            target: ''
          - name: Android-64
            os: ubuntu-latest
            target: Android64
          - name: Android-32
            os: ubuntu-latest
            target: Android32

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Mod with Geode SDK
        uses: geode-sdk/build-geode-action@v3
        with:
          target: ${{ matrix.config.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3Dmodel-importer-${{ matrix.config.name }}
          path: build/*.geode